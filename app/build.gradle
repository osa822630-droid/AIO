plugins {
    alias(libs.plugins.android.application)
}

apply plugin: 'io.objectbox'

def targetAbi = project.hasProperty('targetAbi') ? project.property('targetAbi').toString() : 'arm64-v8a'

android {
    namespace 'com.nextgen'
    compileSdk 36
    buildTypes.release.ndk.debugSymbolLevel = "SYMBOL_TABLE"

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    defaultConfig {
        applicationId "com.nextgen"
        minSdk 24
        //noinspection OldTargetApi
        targetSdk 36
        versionCode 27
        versionName "2026.11.17"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
        ndk {
            abiFilters targetAbi, "x86_64"
        }
    }

    signingConfigs {
        debugConfig {
            def ksFile = file("${rootDir}/debug.keystore")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            if (file("${rootDir}/debug.keystore").exists()) {
                signingConfig signingConfigs.debugConfig
            }
            debuggable true
            minifyEnabled false
            buildConfigField "boolean", "IS_DEBUG_MODE_ON", "true"
        }

        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            buildConfigField "boolean", "IS_DEBUG_MODE_ON", "false"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/*.kotlin_module']
        }
    }

    splits {
        abi {
            enable false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    dependenciesInfo {
        includeInBundle false
        includeInApk false
    }
}

dependencies {
    implementation libs.material
    implementation libs.appcompat
    implementation libs.androidx.preference
    implementation libs.styled.cardview
    implementation libs.androidx.recyclerview

    implementation libs.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.biometric

    implementation libs.retrofit
    implementation libs.retrofit2.converter.gson
    implementation libs.okhttp.sse

    implementation libs.ytdlp
    implementation libs.ffmpeg
    implementation libs.aria2c
    implementation libs.newpipe.extractor

    implementation libs.exoplayer.core
    implementation libs.exoplayer.hls
    implementation libs.exoplayer.dash
    implementation libs.exoplayer.ui
    implementation libs.exoplayer.database
    implementation libs.exoplayer.datasource
    implementation libs.exoplayer.smoothstreaming
    implementation libs.exoplayer.mediasession
    implementation libs.androidx.media

    implementation libs.mp4.iso.parser

    implementation libs.lottie
    implementation libs.jsoup
    implementation libs.glide

    implementation libs.objectbox.android
    implementation libs.androidx.documentfile
    implementation libs.autolink

    coreLibraryDesugaring libs.desugar.jdk.libs.nio

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.espresso.core
}
